name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout game
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lua5.4 zip imagemagick
          sudo ln -sf "$(command -v lua5.4)" /usr/local/bin/lua
          if ! command -v magick >/dev/null; then
            sudo ln -sf "$(command -v convert)" /usr/local/bin/magick
          fi

      - name: Build cartridge
        run: |
          set -euo pipefail
          make lupi
          test -s duckhunt.lupi
          unzip -l duckhunt.lupi | grep -q 'sfx/bark.ogg'

      - name: Release .lupi
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Duck Hunt
          files: duckhunt.lupi
          make_latest: true
